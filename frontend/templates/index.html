<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDICYCLE // Medicine Intelligence & Safety Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: { sans:['Inter','sans-serif'], display:['Rajdhani','sans-serif'], mono:['JetBrains Mono','monospace'] },
        colors: {
          obsidian:'#060709', panel:'#0C0F14', panelElevated:'#12161D', borderSubtle:'#1E2530',
          crimson:{ DEFAULT:'#C81E2B', bright:'#FF2A3C', dark:'#6B0F17' },
          bioEmerald:'#10B981', bioAmber:'#F59E0B', iceWhite:'#E6EDF3', steelGray:'#7D8590'
        }
      } }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-obsidian bg-tactical-grid scanlines text-iceWhite antialiased selection:bg-crimson selection:text-white">

  <!-- Toast -->
  <div id="tactical-toast" class="fixed bottom-5 right-5 z-50 hidden">
    <div class="hud-card hud-brackets px-4 py-3 flex items-center gap-3 shadow-2xl border-crimson/60 bg-panelElevated min-w-[280px] max-w-sm">
      <span id="toast-dot" class="w-2 h-2 rounded-full bg-crimson-bright hazard-pulse shrink-0"></span>
      <div class="flex-1">
        <div class="font-mono text-[10px] tracking-widest text-crimson-bright uppercase">System log</div>
        <div id="tactical-toast-msg" class="text-xs text-iceWhite font-medium mt-0.5"></div>
      </div>
    </div>
  </div>

  <!-- Generic dossier modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4" onclick="if(event.target===this)closeModal()">
    <div class="hud-card hud-brackets w-full max-w-2xl max-h-[92vh] flex flex-col bg-panel border border-crimson/50 shadow-[0_0_50px_rgba(200,30,43,0.2)] fade-in-panel">
      <div class="flex items-center justify-between px-5 py-3.5 bg-obsidian/90 border-b border-borderSubtle shrink-0">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="px-1.5 py-0.5 text-[10px] font-mono font-bold bg-crimson/20 text-crimson-bright border border-crimson/40 rounded-sm shrink-0">DOSSIER</span>
          <span id="modal-code" class="font-mono text-xs text-steelGray truncate"></span>
        </div>
        <button onclick="closeModal()" class="text-steelGray hover:text-crimson-bright font-mono text-xs px-2 py-1" aria-label="Close">[ESC]</button>
      </div>
      <div id="modal-body" class="p-6 space-y-5 overflow-y-auto"></div>
      <div id="modal-footer" class="px-6 py-3.5 bg-obsidian/70 border-t border-borderSubtle flex flex-wrap items-center justify-end gap-2.5 shrink-0"></div>
    </div>
  </div>

  <!-- Login / Register -->
  <div id="auth-view" class="hidden min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(circle at 30% 25%, rgba(200,30,43,.14) 0%, transparent 50%), radial-gradient(circle at 75% 80%, rgba(16,185,129,.05) 0%, transparent 45%);"></div>
    <div class="w-full max-w-md relative z-10 fade-in-panel">
      <div class="hud-card hud-brackets p-7 sm:p-8 shadow-2xl">
        <div class="flex flex-col items-center text-center mb-6">
          <div class="w-14 h-14 mb-4">
            <svg viewBox="0 0 64 64" class="w-full h-full drop-shadow-[0_0_12px_rgba(200,30,43,0.55)]">
              <polygon points="20,4 44,4 60,20 60,44 44,60 20,60 4,44 4,20" fill="#0C0F14" stroke="#C81E2B" stroke-width="2.5"/>
              <path d="M27 16 H37 V27 H48 V37 H37 V48 H27 V37 H16 V27 H27 Z" fill="#C81E2B"/>
              <circle cx="32" cy="32" r="3" fill="#060709"/>
            </svg>
          </div>
          <h1 class="font-display text-3xl font-bold tracking-[0.18em] text-white uppercase">MEDICYCLE</h1>
          <p class="text-xs font-mono tracking-wider text-steelGray mt-1">Medicine intelligence & safety platform</p>
          <div class="mt-3 px-3 py-1 bg-crimson/10 border border-crimson/30 rounded-sm">
            <p class="font-mono text-[10px] tracking-widest text-crimson-bright uppercase">Authorized clinical personnel only</p>
          </div>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <div><label class="lbl" for="login-id">Username or email</label>
            <input id="login-id" class="field font-mono" autocomplete="username" required placeholder="Enter username or email"></div>
          <div><label class="lbl" for="login-pw">Password</label>
            <input id="login-pw" type="password" class="field font-mono" autocomplete="current-password" required placeholder="Enter password"></div>
          <div id="login-err" class="hidden text-xs font-mono text-crimson-bright"></div>
          <button type="submit" id="login-btn" class="w-full btn-crimson py-2.5 rounded-sm font-display font-bold text-base tracking-[0.14em] text-white uppercase">Sign in</button>
        </form>

        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
          <div><label class="lbl" for="reg-name">Full name</label><input id="reg-name" class="field" maxlength="100" required></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl" for="reg-user">Username</label><input id="reg-user" class="field font-mono" maxlength="50" required></div>
            <div><label class="lbl" for="reg-role">Role</label>
              <select id="reg-role" class="field" required>
                <option value="">Select…</option><option value="DOCTOR">Doctor</option><option value="NURSE">Nurse</option><option value="RECEPTIONIST">Receptionist</option>
              </select></div>
          </div>
          <div><label class="lbl" for="reg-email">Email</label><input id="reg-email" type="email" class="field" maxlength="120" required></div>
          <div><label class="lbl" for="reg-pw">Password (8–72 bytes)</label><input id="reg-pw" type="password" class="field font-mono" minlength="8" required autocomplete="new-password"></div>
          <div id="reg-err" class="hidden text-xs font-mono text-crimson-bright"></div>
          <button type="submit" id="reg-btn" class="w-full btn-crimson py-2.5 rounded-sm font-display font-bold text-base tracking-[0.14em] text-white uppercase">Request access</button>
        </form>

        <div class="mt-6 pt-4 border-t border-borderSubtle text-center text-xs text-steelGray">
          <span id="auth-switch-text">New staff member?</span>
          <button type="button" id="auth-switch-btn" onclick="toggleAuthMode()" class="text-crimson-bright hover:underline font-mono ml-1">Request access</button>
        </div>
      </div>
      <div class="mt-3 text-center font-mono text-[10px] text-steelGray/60 tracking-widest">All access is logged</div>
    </div>
  </div>

  <!-- Workspace -->
  <div id="workspace-shell" class="hidden min-h-screen flex flex-col lg:flex-row">
    <header class="lg:hidden flex items-center justify-between px-4 py-3 bg-panel border-b border-borderSubtle sticky top-0 z-30">
      <div class="font-display font-bold tracking-widest text-lg text-white">MEDICYCLE</div>
      <button onclick="toggleMobileSidebar()" class="px-3 py-1.5 border border-borderSubtle rounded-sm font-mono text-xs hover:border-crimson">MENU ☰</button>
    </header>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-panel border-r border-borderSubtle flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-out">
      <div class="overflow-y-auto">
        <div class="p-5 border-b border-borderSubtle flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 shrink-0">
              <svg viewBox="0 0 64 64" class="w-full h-full">
                <polygon points="20,4 44,4 60,20 60,44 44,60 20,60 4,44 4,20" fill="#12161D" stroke="#C81E2B" stroke-width="3"/>
                <path d="M27 16 H37 V27 H48 V37 H37 V48 H27 V37 H16 V27 H27 Z" fill="#C81E2B"/>
                <circle cx="32" cy="32" r="2.5" fill="#0C0F14"/>
              </svg>
            </div>
            <div>
              <div class="font-display font-bold text-xl tracking-[0.14em] text-white leading-none">MEDICYCLE</div>
              <div class="font-mono text-[10px] text-steelGray tracking-wider mt-1">Medicine intelligence</div>
            </div>
          </div>
          <button onclick="toggleMobileSidebar()" class="lg:hidden text-steelGray hover:text-white font-mono text-xs">✕</button>
        </div>

        <div class="py-4 space-y-6">
          <div>
            <div class="px-5 mb-2 font-mono text-[10px] font-semibold tracking-[0.18em] text-steelGray/80 uppercase">Workspace</div>
            <nav class="space-y-0.5">
              <button onclick="navigateTo('dashboard')" data-nav="dashboard" class="nav-item w-full flex items-center gap-3 px-5 py-2.5 text-sm font-medium text-steelGray"><span class="w-4 text-center">▦</span><span>Dashboard</span></button>
              <button onclick="navigateTo('medicines')" data-nav="medicines" class="nav-item w-full flex items-center gap-3 px-5 py-2.5 text-sm font-medium text-steelGray"><span class="w-4 text-center">✚</span><span>Medicines</span></button>
              <button onclick="navigateTo('safety')" data-nav="safety" class="nav-item w-full flex items-center gap-3 px-5 py-2.5 text-sm font-medium text-steelGray"><span class="w-4 text-center">♥</span><span>Safety & interactions</span></button>
              <button onclick="navigateTo('recalls')" data-nav="recalls" class="nav-item w-full flex items-center justify-between px-5 py-2.5 text-sm font-medium text-steelGray">
                <span class="flex items-center gap-3"><span class="w-4 text-center">⚠</span><span>Recalls & alerts</span></span>
                <span id="recall-badge" class="hidden px-1.5 text-[10px] font-mono font-bold bg-crimson/20 text-crimson-bright border border-crimson/50 rounded-sm"></span>
              </button>
              <button onclick="navigateTo('batches')" data-nav="batches" class="nav-item w-full flex items-center gap-3 px-5 py-2.5 text-sm font-medium text-steelGray"><span class="w-4 text-center">▣</span><span>Batch management</span></button>
              <button onclick="navigateTo('admin')" data-nav="admin" id="nav-admin" class="hidden nav-item w-full flex items-center gap-3 px-5 py-2.5 text-sm font-medium text-steelGray"><span class="w-4 text-center">⚙</span><span>User management</span></button>
            </nav>
          </div>
          <div>
            <div class="px-5 mb-2 font-mono text-[10px] font-semibold tracking-[0.18em] text-steelGray/80 uppercase">System</div>
            <nav>
              <button onclick="navigateTo('profile')" data-nav="profile" class="nav-item w-full flex items-center gap-3 px-5 py-2.5 text-sm font-medium text-steelGray"><span class="w-4 text-center">☺</span><span>My profile</span></button>
            </nav>
          </div>
        </div>
      </div>

      <div class="p-4 border-t border-borderSubtle bg-obsidian/50 space-y-3">
        <div class="flex items-center gap-3 px-1">
          <div id="side-initial" class="w-9 h-9 rounded-sm bg-crimson flex items-center justify-center font-display font-bold text-white text-base shadow-[0_0_12px_rgba(200,30,43,0.45)]"></div>
          <div class="min-w-0">
            <div id="side-name" class="text-xs font-semibold text-iceWhite truncate"></div>
            <div id="side-role" class="font-mono text-[10px] text-crimson-bright tracking-widest uppercase"></div>
          </div>
        </div>
        <button onclick="handleSignOut()" class="btn-ghost w-full py-2 px-3 rounded-sm bg-panel text-xs font-mono flex items-center justify-center gap-2"><span>⇥</span><span>Sign out</span></button>
      </div>
    </aside>

    <main class="flex-1 min-w-0 flex flex-col">
      <div class="px-5 sm:px-8 py-4 border-b border-borderSubtle/70 bg-obsidian/60 backdrop-blur-sm flex flex-wrap items-center justify-between gap-4">
        <div>
          <div class="font-mono text-[11px] tracking-wider text-steelGray flex items-center gap-1.5">
            <span>WORKSPACE</span><span class="text-crimson-bright">//</span><span id="page-breadcrumb" class="text-sky-400 uppercase"></span>
          </div>
          <h1 id="page-title" class="font-display text-2xl sm:text-3xl font-bold tracking-wide text-white mt-0.5"></h1>
        </div>
        <div class="flex items-center gap-4">
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-panel border border-borderSubtle rounded-sm">
            <svg width="64" height="18" viewBox="0 0 64 18" class="overflow-visible"><polyline fill="none" stroke="#10B981" stroke-width="1.5" points="0,9 14,9 18,3 22,15 26,1 30,17 34,9 64,9" class="ecg-path"/></svg>
          </div>
          <div class="flex items-center gap-2 px-3 py-1.5 bg-panel border border-borderSubtle rounded-sm">
            <span id="health-dot" class="w-2 h-2 rounded-full bg-steelGray"></span>
            <span id="health-text" class="font-mono text-xs text-iceWhite tracking-wider">Checking…</span>
          </div>
        </div>
      </div>
      <div id="page-content" class="flex-1 p-5 sm:p-8 max-w-[1440px] w-full mx-auto"></div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
